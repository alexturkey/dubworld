# Dependabot: weekly check of Python dependencies (pyproject.toml / requirements*.txt) and GitHub Actions.
# PRs are merged by hand after the CPU tests pass; ML stack pins (torch, ctranslate2) are bumped only after a measured install.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["bagimlilik"]
    commit-message:
      prefix: "bagimlilik"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "ctranslate2"
      # Upper-bounded by an upstream pin; a bump breaks the install (docs/engineering/pinned-values.md, "Upstream-capped packages").
      - dependency-name: "coqui-tts-trainer"
        versions: [">=0.4.0"]  # coqui-tts 0.27.5 requires coqui-tts-trainer<0.4.0
      - dependency-name: "antlr4-python3-runtime"
        versions: [">=4.10"]  # omegaconf 2.3 requires antlr4-python3-runtime==4.9.*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["bagimlilik"]
    commit-message:
      prefix: "ci"
