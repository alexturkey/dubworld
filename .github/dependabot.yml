# Dependabot: weekly check of Python dependencies (pyproject.toml / requirements*.txt) and GitHub Actions.
# PRs are merged by hand after the CPU tests pass; ML stack pins (torch, ctranslate2) are bumped only after a measured install.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["bagimlilik"]
    commit-message:
      prefix: "bagimlilik"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "ctranslate2"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["bagimlilik"]
    commit-message:
      prefix: "ci"
