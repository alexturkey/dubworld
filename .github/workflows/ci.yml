# CI: lint + CPU tests. No GPU, no model downloads, no secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff>=0.14.3"
      - name: Syntax errors and undefined names (blocking)
        run: ruff check --select E9,F63,F7,F82 --output-format=github src tests
      - name: Full rule set (report only)
        run: ruff check --exit-zero --output-format=github src tests
      - name: Legal and privacy gate (blocking; no third-party installs, standard library only)
        run: python scripts/yasal_denetim.py
      - name: Tracked files import only tracked modules (blocking; also run locally after git add, before commit)
        run: python scripts/izli_import_denetimi.py

  audit:
    # Known-vulnerability report for the hash-locked install sets (report only: some pins are held back on purpose,
    # see SECURITY.md "Known advisories in pinned dependencies"). torch wheels come from the PyTorch index and are skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit requirements/cpu.txt and gpu.txt (report only)
        continue-on-error: true
        run: |
          pip-audit -r requirements/cpu.txt --no-deps --disable-pip --progress-spinner off
          pip-audit -r requirements/gpu.txt --no-deps --disable-pip --progress-spinner off

  test-cpu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package without the ML stack (unit tests need only the standard library)
        run: |
          python -m pip install "pytest>=9.0.3"
          python -m pip install --no-deps -e .
      - name: Unit and smoke tests (CPU, no downloads)
        run: python -m pytest -m "not gpu and not slow"
      - name: Documentation check (links, paths, commands, flags, settings, install steps, env vars; blocking)
        run: python scripts/belge_dogrula.py
      - name: Language parity check (EN/TR structure blocking; README translation drift reported as warnings)
        run: python scripts/dil_eslik_denetimi.py
